# CI: push / PR のたびにクリーンな環境で全テストを実行する。
# 開発機は Python 3.11 だが本番エンジン環境（miniforge）は 3.13 のため、
# 両方のマトリクスで回して「3.13 でそのまま動く」を常に事実にしておく。
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
