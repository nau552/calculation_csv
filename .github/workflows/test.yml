# CI: push / PR のたびにクリーンな環境で全テストを実行する。
# 開発機・本番エンジン環境（miniforge）とも Python 3.13 のため 3.13 のみで検証
# （2026-07-28 に開発機を 3.11 から移行。旧環境のサポートが必要になったら
# matrix にバージョンを足すだけ）。
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Run tests
        run: python -m pytest -q
