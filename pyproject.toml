[project]
name = "scorelib_param"
# 版数はここには書かない: scorelib_param/__init__.py の __version__ が唯一の
# 正で、下の [tool.setuptools.dynamic] がそれを参照する。
# 版上げの手順は README「バージョンの上げ方」を参照
dynamic = ["version"]
description = "Score / score-part definition, aggregation engine, and CLI for score_gui Phase1"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0",
    "pydantic>=2.0",
    "simpleeval>=1.0",
]

[project.optional-dependencies]
# ui: the Streamlit score-design app (ui/app.py); the engine itself never needs it.
# streamlit-sortables is a soft dependency: without it the app falls back
# from drag&drop reordering to up/down buttons.
ui = ["streamlit>=1.50", "streamlit-sortables>=0.3"]
# ruff はチーム共通コンテナの設定(ruff.toml に転記済み)で lint/format するため
# 固定版で入れる(版が動くと有効ルールが変わり、警告ゼロの状態が崩れるため)
dev = ["pytest>=8.0", "streamlit>=1.50", "streamlit-sortables>=0.3", "ruff==0.16.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "scorelib_param.__version__"}

[tool.setuptools.packages.find]
# scorelib_param.batch などのサブパッケージも含める（固定リストだと追加を忘れる）
include = ["scorelib_param*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
