[project]
name = "scorelib"
version = "0.1.0"
description = "Score / score-part definition, aggregation engine, and CLI for score_gui Phase1"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0",
    "pydantic>=2.0",
    "simpleeval>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scorelib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
