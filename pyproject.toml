[project]
name = "scorelib_param"
version = "0.3.0"
description = "Score / score-part definition, aggregation engine, and CLI for score_gui Phase1"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0",
    "pydantic>=2.0",
    "simpleeval>=1.0",
]

[project.optional-dependencies]
# ui: the Streamlit score-design app (ui/app.py); the engine itself never needs it.
# streamlit-sortables is a soft dependency: without it the app falls back
# from drag&drop reordering to up/down buttons.
ui = ["streamlit>=1.50", "streamlit-sortables>=0.3"]
dev = ["pytest>=8.0", "streamlit>=1.50", "streamlit-sortables>=0.3"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scorelib_param"]

[tool.pytest.ini_options]
testpaths = ["tests"]
