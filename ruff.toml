# scorelib 所有の設定。チーム標準の設定(.devcontainer/ruff.toml — チームコンテナ
# 配布物の転記。チーム内リポジトリと同じ配置)を無改変のまま extend で継承する。
#
# 免除はこのファイルに書かない。理由: チームコンテナのエディタ・/check はチーム
# 設定だけを読み、リポジトリ側の toml は読まないため、ここに書いた免除はチーム内
# では効かない。免除は各ファイル内の抑止コメント(# ruff: ignore[ルール名] /
# # ruff: file-ignore[ルール名])に理由つきで置く — ファイルに同居する抑止だけが
# どの環境でも同じに効く(docs/dev_workflow.md「ruff」参照)
extend = ".devcontainer/ruff.toml"

# チーム配布物は検査対象から外す(設定として読むだけで、中身の検査はチームの管轄)
extend-exclude = [".devcontainer"]

[lint]
# チーム設定の tests/* 免除の再掲(内容は一切変えないこと)。per-file-ignores の
# パターンは「定義した設定ファイルのあるディレクトリ」基準で解決されるため、
# extend で継承すると .devcontainer/tests/* の意味になり効かない(実測 2026-08-05)。
# チーム内の /check(--config 直指定。カレントディレクトリ基準)では原本のまま効く
extend-per-file-ignores."tests/*" = [
    "S101",     # assertの使用を禁止
    "INP001",   # __init__.pyの作成を強制
    "PLC2701",  # 外部モジュールからプライベートな名前（_から始まる）のimport禁止
    "SLF001",   # プライベートメソッド（_から始まる）の使用禁止
    "FBT001",   # parametrize の bool 型引数
    "FBT002",   # parametrize の bool デフォルト引数
]

# このファイル自身への preview 警告(RUF201: セレクタをコードでなく名前で書け)の
# 自己参照免除。名前表記のセレクタは素の(--preview 無し)ruff が設定ごと読めなく
# なる(致命エラー。実測 2026-08-05)ため、コード表記 + この免除で両立させる
extend-per-file-ignores."ruff.toml" = ["RUF201"]
