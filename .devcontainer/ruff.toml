# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 119
indent-width = 4

# Assume Python 3.13
target-version = "py313"

[lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
# select = ["E4", "E7", "E9", "F"]
select = ["ALL"]
ignore = [
    "COM812",  # 末尾の「,」を強制
    "COM819",  # 末尾の「,」を禁止
    "D100",    # 公開モジュールのdocstringを強制
    "D203",    # Classとdocstringの間に空白行を挿入することを強制
    "D213",    # docstringのSummary行を"""の右ではなく次の行に書くことを強制
    "D400",    # docstringの最初の行の末尾が「.」であることを強制
    "D415",    # docstringの最初の行の末尾が「.」「?」「!」であることを強制
    "E111",    # 4つのスペースの倍数でないインデントを禁止
    "E114",    # 4つのスペースの倍数でないコメントのインデントを禁止
    "E117",    # 過度なインデントを禁止
    "ISC001",  # 単一行の暗黙的に連結された文字列を禁止
    "ISC002",  # 複数行の暗黙的に連結された文字列を禁止
    "Q000",    # 一重引用符「'」を使用する文字列を禁止
    "Q001",    # 一重引用符「'''」を使用する複数行の文字列を禁止
    "Q003",    # 文字列内のエスケープされた引用符「\'」「\"」を禁止
    "FIX002",  # TODOの使用を禁止
    "TD003",   # TODOにissueリンクがないことを禁止
    "ERA001",  # コメントアウトされたコードを禁止
    "T201",    # printの使用を禁止
    "TRY002",  # 標準のExceptionの使用を禁止
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

# 特定ファイル/ディレクトリに関する除外設定
[lint.per-file-ignores]
# tests ディレクトリの除外設定
"tests/*" = [
    "S101",     # assertの使用を禁止
    "INP001",   # __init__.pyの作成を強制
    "PLC2701",  # 外部モジュールからプライベートな名前（_から始まる）のimport禁止
    "SLF001",   # プライベートメソッド（_から始まる）の使用禁止
    "FBT001",   # parametrize の bool 型引数
    "FBT002",   # parametrize の bool デフォルト引数
]
